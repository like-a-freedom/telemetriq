name: Deploy GitHub Pages

on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/**"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Pages site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    env:
      PAGES_BUILD: "true"
      VITE_ROUTER_MODE: hash
      VITE_SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "25"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages

      - name: Fetch and verify the pinned FFmpeg core
        run: bun run fetch-ffmpeg-core

      - name: Build static Pages site
        run: bun run build
        env:
          VITE_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/', github.event.repository.name) || steps.pages.outputs.base_path || '/' }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-pages-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify the built Pages site and real video export
        run: bun run test:e2e:pages
        env:
          RUN_REAL_PROCESSING: "1"
          PAGES_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/', github.event.repository.name) || steps.pages.outputs.base_path || '/' }}

      - name: Upload the verified Pages artifact
        if: >-
          (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy Pages artifact
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact produced and verified by the build job
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
